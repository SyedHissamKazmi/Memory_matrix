<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Matrix | College Exhibition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>Memory Matrix</h1>
        <p>College Tech Fest 2025</p>
    </div>
    
    <div class="stats">
        <div class="stat-box">
            <div>Moves</div>
            <div id="moves">0</div>
        </div>
        <div class="stat-box">
            <div>Time</div>
            <div id="timer">00:00</div>
        </div>
        <div class="stat-box">
            <div>Matches</div>
            <div id="matches">0</div>
        </div>
        <div class="stat-box">
            <div>Best</div>
            <div id="best">0</div>
        </div>
    </div>
    
    <div class="grid" id="grid"></div>
    
    <div class="controls">
        <button id="restartBtn">🔄 Restart</button>
        <button id="difficultyBtn">⚙️ Difficulty</button>
        <button id="soundBtn">🔊 Sound</button>
        <button id="fullscreenBtn">⛶ Fullscreen</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
