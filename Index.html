<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Matrix | College Exhibition</title>
    <style>
        :root {
            --purple: #8A2BE2;
            --green: #00ff41;
            --blue: #00e0ff;
            --dark: #0a0a0f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--dark); 
            color: white; 
            font-family: monospace;
            min-height: 100vh;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(90deg, var(--purple), var(--blue));
            padding: 15px;
            border-radius: 10px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px auto;
            max-width: 400px;
        }
        .card {
            aspect-ratio: 1;
            background: var(--purple);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }
        .card.flipped {
            background: var(--green);
            transform: rotateY(180deg);
        }
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        button {
            background: var(--blue);
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        @media (max-width: 480px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Memory Matrix</h1>
        <p>College Tech Fest 2025</p>
    </div>
    
    <div class="stats">
        <div class="stat-box">
            <div>Moves</div>
            <div id="moves">0</div>
        </div>
        <div class="stat-box">
            <div>Time</div>
            <div id="timer">00:00</div>
        </div>
        <div class="stat-box">
            <div>Matches</div>
            <div id="matches">0</div>
        </div>
        <div class="stat-box">
            <div>Best</div>
            <div id="best">0</div>
        </div>
    </div>
    
    <div class="grid" id="grid"></div>
    
    <div class="controls">
        <button onclick="restartGame()">🔄 Restart</button>
        <button onclick="changeDifficulty()">⚙️ Difficulty</button>
        <button onclick="toggleSound()">🔊 Sound</button>
        <button onclick="toggleFullscreen()">⛶ Fullscreen</button>
    </div>
    
    <script>
        // Game Configuration
        const difficulties = {
            easy: { pairs: 6, time: 120 },
            medium: { pairs: 8, time: 180 },
            hard: { pairs: 12, time: 240 }
        };
        
        // Game State
        let game = {
            difficulty: 'medium',
            flippedCards: [],
            moves: 0,
            matches: 0,
            timer: null,
            time: 0,
            sound: true,
            bestScore: localStorage.getItem('bestScore') || 0
        };
        
        // Initialize Game
        function initGame() {
            const config = difficulties[game.difficulty];
            game.flippedCards = [];
            game.moves = 0;
            game.matches = 0;
            game.time = config.time;
            
            updateDisplay();
            generateGrid(config.pairs);
            startTimer();
        }
        
        // Generate Card Grid
        function generateGrid(pairs) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            // Create card values
            let cards = [];
            for(let i = 1; i <= pairs; i++) {
                cards.push(i, i);
            }
            
            // Shuffle
            cards = cards.sort(() => Math.random() - 0.5);
            
            // Create cards
            cards.forEach((value, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.value = value;
                card.dataset.index = index;
                card.textContent = '?';
                card.onclick = () => flipCard(card);
                grid.appendChild(card);
            });
            
            // Adjust grid columns based on card count
            const cols = pairs <= 6 ? 3 : 4;
            grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        }
        
        // Card Click Handler
        function flipCard(card) {
            if(game.flippedCards.length >= 2 || card.classList.contains('flipped')) return;
            
            card.classList.add('flipped');
            card.textContent = card.dataset.value;
            game.flippedCards.push(card);
            
            if(game.flippedCards.length === 2) {
                game.moves++;
                checkMatch();
            }
            
            updateDisplay();
        }
        
        // Check for Match
        function checkMatch() {
            const [card1, card2] = game.flippedCards;
            
            if(card1.dataset.value === card2.dataset.value) {
                game.matches++;
                card1.style.background = '#00ff41';
                card2.style.background = '#00ff41';
                
                if(game.matches === difficulties[game.difficulty].pairs) {
                    endGame();
                }
                
                game.flippedCards = [];
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    card1.textContent = '?';
                    card2.textContent = '?';
                    game.flippedCards = [];
                }, 1000);
            }
        }
        
        // Timer Functions
        function startTimer() {
            clearInterval(game.timer);
            game.timer = setInterval(() => {
                game.time--;
                document.getElementById('timer').textContent = formatTime(game.time);
                
                if(game.time <= 0) {
                    endGame();
                }
            }, 1000);
        }
        
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        
        // Game Controls
        function restartGame() {
            clearInterval(game.timer);
            initGame();
        }
        
        function changeDifficulty() {
            const levels = ['easy', 'medium', 'hard'];
            const current = levels.indexOf(game.difficulty);
            game.difficulty = levels[(current + 1) % levels.length];
            restartGame();
        }
        
        function toggleSound() {
            game.sound = !game.sound;
            document.querySelector('.controls button:nth-child(3)').textContent = 
                game.sound ? '🔊 Sound' : '🔇 Muted';
        }
        
        function toggleFullscreen() {
            if(!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
        
        // End Game
        function endGame() {
            clearInterval(game.timer);
            
            const score = game.matches * 100 - game.moves * 5;
            if(score > game.bestScore) {
                game.bestScore = score;
                localStorage.setItem('bestScore', score);
            }
            
            setTimeout(() => {
                alert(`Game Over!\nMatches: ${game.matches}\nMoves: ${game.moves}\nScore: ${score}`);
                restartGame();
            }, 500);
        }
        
        // Update Display
        function updateDisplay() {
            document.getElementById('moves').textContent = game.moves;
            document.getElementById('matches').textContent = game.matches;
            document.getElementById('best').textContent = game.bestScore;
            document.getElementById('timer').textContent = formatTime(game.time);
        }
        
        // Initialize on Load
        window.onload = initGame;
        
        // Mobile Touch Support
        document.addEventListener('touchstart', (e) => {
            if(e.touches.length > 1) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
